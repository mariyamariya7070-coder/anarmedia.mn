name: AnarMedia Facebook News Sync

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Facebook posts
        run: python scripts/fetch_facebook.py
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}

      - name: Save news
        run: |
          git config user.name "AnarMedia Bot"
          git config user.email "actions@github.com"
          git add data/facebook-posts.json
          git diff --cached --quiet || (
            git commit -m "Update Facebook news"
            git push
          )
